<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f5f7" />
    <title>데일리 업무일지</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f172a'/%3E%3Cpath d='M9 16.5l4.2 4.2L23 11' fill='none' stroke='white' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/app.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
      .hidden { display: none !important; }
      .z-toast { z-index: 60; }
      .detail-scroll { max-height: 50vh; }
      body {
        background:
          radial-gradient(900px 280px at 0% -10%, rgba(244, 63, 94, 0.06), transparent 50%),
          radial-gradient(820px 280px at 100% -20%, rgba(16, 185, 129, 0.07), transparent 46%),
          #f4f5f7;
      }
      button:not(:disabled) { cursor: pointer; }
      input[type='date'] { color-scheme: light; }
      ::selection { background: #e2e8f0; }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; transition: none !important; }
      }
    </style>
  </head>
  <body class="min-h-screen font-sans text-slate-900 antialiased">
    <p id="boot-status" class="px-4 py-16 text-center text-sm text-slate-500">로그인 상태를 확인하고 있습니다.</p>

    <div id="auth-screen" class="hidden">
      <div class="mx-auto flex min-h-screen max-w-md items-center px-4 py-16">
        <div class="w-full rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
          <div class="mb-6 flex items-center gap-3">
            <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-slate-900 text-white shadow-sm">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-5 w-5" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 12.5 9.2 16.7 19 7" />
              </svg>
            </span>
            <div>
              <h1 id="auth-title" class="text-lg font-semibold tracking-tight">로그인</h1>
              <p id="auth-lead" class="text-sm text-slate-500">아이디와 비밀번호로 들어옵니다.</p>
            </div>
          </div>

          <form id="auth-form" class="space-y-4" novalidate>
            <label class="block">
              <span class="mb-1.5 block text-sm font-medium text-slate-700">아이디</span>
              <input id="auth-username" name="username" type="text" autocomplete="username" maxlength="20" placeholder="영문, 숫자, 밑줄 4~20자" class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-slate-400 focus:ring-4 focus:ring-slate-100" />
            </label>
            <label class="block">
              <span class="mb-1.5 block text-sm font-medium text-slate-700">비밀번호</span>
              <input id="auth-password" name="password" type="password" autocomplete="current-password" maxlength="72" placeholder="8자 이상" class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-slate-400 focus:ring-4 focus:ring-slate-100" />
            </label>
            <label id="password-confirm-field" class="hidden block">
              <span class="mb-1.5 block text-sm font-medium text-slate-700">비밀번호 확인</span>
              <input id="auth-password-confirm" type="password" autocomplete="new-password" maxlength="72" placeholder="비밀번호를 한 번 더 입력" class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-slate-400 focus:ring-4 focus:ring-slate-100" />
            </label>
            <label id="email-field" class="hidden block">
              <span class="mb-1.5 block text-sm font-medium text-slate-700">이메일</span>
              <input id="auth-email" name="email" type="email" autocomplete="email" maxlength="254" placeholder="name@example.com" class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-slate-400 focus:ring-4 focus:ring-slate-100" />
            </label>
            <label id="phone-field" class="hidden block">
              <span class="mb-1.5 block text-sm font-medium text-slate-700">전화번호</span>
              <input id="auth-phone" name="tel" type="tel" autocomplete="tel" inputmode="numeric" maxlength="13" placeholder="01012345678" class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-slate-400 focus:ring-4 focus:ring-slate-100" />
            </label>
            <p id="auth-error" class="hidden text-sm text-rose-600"></p>
            <button id="auth-submit" type="submit" class="w-full rounded-lg bg-slate-900 px-4 py-2.5 text-sm font-medium text-white hover:bg-slate-800 disabled:opacity-50">로그인</button>
          </form>
          <button id="auth-switch" type="button" class="mt-4 text-sm font-medium text-slate-500 hover:text-slate-800">계정이 없나요? 회원가입</button>
        </div>
      </div>
    </div>

    <div id="workspace" class="hidden">
    <header class="sticky top-0 z-30 border-b border-slate-200/80 bg-white/85 backdrop-blur-md">
      <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-4 px-4 py-4 sm:px-6 lg:px-8">
        <div class="flex items-center gap-3">
          <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-slate-900 text-white shadow-sm">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-5 w-5" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 12.5 9.2 16.7 19 7" />
            </svg>
          </span>
          <div>
            <h1 class="text-lg font-semibold tracking-tight">데일리 업무일지</h1>
            <p id="today-label" class="text-sm text-slate-500">불러오는 중</p>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <input id="search-input" type="search" placeholder="업무 검색" class="w-36 rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm outline-none focus:border-slate-400 sm:w-44" />
          <button id="account-button" type="button" class="hidden rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100"></button>
          <button id="logout-button" type="button" class="hidden rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100">로그아웃</button>
          <div class="inline-flex rounded-xl bg-slate-100 p-1" role="group" aria-label="화면 전환">
            <button type="button" data-view-tab="board" class="rounded-lg bg-white px-3.5 py-1.5 text-sm font-medium text-slate-900 shadow-sm" aria-pressed="true">보드</button>
            <button type="button" data-view-tab="history" class="rounded-lg px-3.5 py-1.5 text-sm font-medium text-slate-500" aria-pressed="false">완료 기록</button>
            <button type="button" data-view-tab="profile" class="rounded-lg px-3.5 py-1.5 text-sm font-medium text-slate-500" aria-pressed="false">마이페이지</button>
          </div>
          <button id="add-button" type="button" disabled class="inline-flex items-center gap-1.5 rounded-lg bg-slate-900 px-3.5 py-2 text-sm font-medium text-white shadow-sm hover:bg-slate-800 disabled:cursor-not-allowed disabled:opacity-40">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-4 w-4" aria-hidden="true">
              <path stroke-linecap="round" d="M12 5v14M5 12h14" />
            </svg>
            업무 추가
          </button>
        </div>
      </div>
    </header>

    <main class="mx-auto max-w-6xl px-4 py-8 pb-20 sm:px-6 lg:px-8">
      <section id="stats" aria-label="요약" class="grid grid-cols-2 gap-3 lg:grid-cols-4">
        <article class="h-28 animate-pulse rounded-xl bg-white shadow-sm"></article>
        <article class="h-28 animate-pulse rounded-xl bg-white shadow-sm"></article>
        <article class="h-28 animate-pulse rounded-xl bg-white shadow-sm"></article>
        <article class="h-28 animate-pulse rounded-xl bg-white shadow-sm"></article>
      </section>

      <div id="view-board" class="mt-8">
        <div class="grid grid-cols-1 gap-8 lg:grid-cols-3">
          <div class="space-y-3">
            <div class="h-16 animate-pulse rounded-xl bg-white/70"></div>
            <div class="h-32 animate-pulse rounded-xl bg-white shadow-sm"></div>
            <div class="h-32 animate-pulse rounded-xl bg-white shadow-sm"></div>
          </div>
          <div class="space-y-3">
            <div class="h-16 animate-pulse rounded-xl bg-white/70"></div>
            <div class="h-32 animate-pulse rounded-xl bg-white shadow-sm"></div>
          </div>
          <div class="space-y-3">
            <div class="h-16 animate-pulse rounded-xl bg-white/70"></div>
            <div class="h-32 animate-pulse rounded-xl bg-white shadow-sm"></div>
          </div>
        </div>
      </div>

      <div id="view-history" class="mt-8 hidden">
        <div class="mx-auto max-w-3xl">
          <header class="mb-4">
            <p class="text-xs font-semibold tracking-widest text-slate-400">HISTORY</p>
            <h2 class="mt-1 text-xl font-semibold tracking-tight">완료 기록</h2>
            <p class="mt-1 text-sm text-slate-500">완료일을 기준으로 기간을 정해 찾을 수 있습니다.</p>
          </header>
          <div class="mb-6 flex flex-wrap items-end gap-3 rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
            <label class="block min-w-36 flex-1">
              <span class="mb-1.5 block text-xs font-medium text-slate-500">시작일</span>
              <input id="history-from" type="date" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm outline-none focus:border-slate-400" />
            </label>
            <label class="block min-w-36 flex-1">
              <span class="mb-1.5 block text-xs font-medium text-slate-500">종료일</span>
              <input id="history-to" type="date" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm outline-none focus:border-slate-400" />
            </label>
            <button id="history-clear-dates" type="button" class="rounded-lg px-3 py-2 text-sm font-medium text-slate-500 hover:bg-slate-100">기간 지우기</button>
          </div>
          <div id="history-list"></div>
        </div>
      </div>

      <div id="view-profile" class="mt-8 hidden">
        <div class="mx-auto max-w-lg">
          <header class="mb-6">
            <p class="text-xs font-semibold tracking-widest text-slate-400">ACCOUNT</p>
            <h2 class="mt-1 text-xl font-semibold tracking-tight">마이페이지</h2>
            <p class="mt-1 text-sm text-slate-500">이메일과 전화번호, 비밀번호를 바꿀 수 있습니다.</p>
          </header>
          <form id="profile-form" class="space-y-4 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm" novalidate>
            <label class="block">
              <span class="mb-1.5 block text-sm font-medium text-slate-700">아이디</span>
              <input id="profile-username" type="text" readonly class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm text-slate-500 outline-none" />
              <p class="mt-1.5 text-xs text-slate-400">아이디는 바꿀 수 없습니다.</p>
            </label>
            <label class="block">
              <span class="mb-1.5 block text-sm font-medium text-slate-700">이메일</span>
              <input id="profile-email" type="email" autocomplete="email" maxlength="254" class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-slate-400 focus:ring-4 focus:ring-slate-100" />
            </label>
            <label class="block">
              <span class="mb-1.5 block text-sm font-medium text-slate-700">전화번호</span>
              <input id="profile-phone" type="tel" autocomplete="tel" inputmode="numeric" maxlength="13" class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-slate-400 focus:ring-4 focus:ring-slate-100" />
            </label>
            <div class="border-t border-slate-100 pt-4">
              <p class="mb-3 text-sm font-medium text-slate-700">비밀번호 변경</p>
              <p class="mb-3 text-xs text-slate-400">바꾸지 않을 때는 비워 두세요.</p>
              <label class="mb-3 block">
                <span class="mb-1.5 block text-sm font-medium text-slate-700">현재 비밀번호</span>
                <input id="profile-current-password" type="password" autocomplete="current-password" maxlength="72" class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-slate-400 focus:ring-4 focus:ring-slate-100" />
              </label>
              <label class="mb-3 block">
                <span class="mb-1.5 block text-sm font-medium text-slate-700">새 비밀번호</span>
                <input id="profile-new-password" type="password" autocomplete="new-password" maxlength="72" class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-slate-400 focus:ring-4 focus:ring-slate-100" />
              </label>
              <label class="block">
                <span class="mb-1.5 block text-sm font-medium text-slate-700">새 비밀번호 확인</span>
                <input id="profile-new-password-confirm" type="password" autocomplete="new-password" maxlength="72" class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-slate-400 focus:ring-4 focus:ring-slate-100" />
              </label>
            </div>
            <p id="profile-error" class="hidden text-sm text-rose-600"></p>
            <button id="profile-submit" type="submit" class="w-full rounded-lg bg-slate-900 px-4 py-2.5 text-sm font-medium text-white hover:bg-slate-800 disabled:opacity-50">저장</button>
          </form>
        </div>
      </div>
    </main>
    </div>

    <div id="modal" class="fixed inset-0 z-40 hidden" aria-hidden="true">
      <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm"></div>
      <div class="relative z-10 flex min-h-full items-end justify-center p-4 sm:items-center">
        <div data-modal-panel role="dialog" aria-modal="true" aria-labelledby="modal-title" class="w-full max-w-lg rounded-2xl border border-slate-200 bg-white shadow-xl">
          <form id="task-form" novalidate>
            <div class="flex items-start justify-between gap-4 border-b border-slate-100 px-5 py-4">
              <div>
                <h2 id="modal-title" class="text-base font-semibold">업무 추가</h2>
                <p class="mt-1 text-sm text-slate-500">제목과 마감일만 있어도 등록할 수 있습니다.</p>
              </div>
              <button id="modal-close" type="button" class="rounded-lg p-2 text-slate-400 hover:bg-slate-100 hover:text-slate-700" aria-label="닫기">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-4 w-4" aria-hidden="true">
                  <path stroke-linecap="round" d="M6 6l12 12M18 6 6 18" />
                </svg>
              </button>
            </div>

            <div class="space-y-4 px-5 py-4">
              <label class="block">
                <span class="mb-1.5 block text-sm font-medium text-slate-700">제목 <span class="text-rose-500">*</span></span>
                <input id="title-input" type="text" maxlength="120" placeholder="어떤 일인지 짧게 적어 주세요" class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-slate-400 focus:ring-4 focus:ring-slate-100" />
              </label>

              <label class="block">
                <span class="mb-1.5 block text-sm font-medium text-slate-700">상세 내용</span>
                <textarea id="description-input" rows="3" maxlength="2000" placeholder="하면 되는 일을 조금만 더 적어 두세요. 비워도 됩니다." class="w-full resize-none rounded-xl border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-slate-400 focus:ring-4 focus:ring-slate-100"></textarea>
              </label>

              <div>
                <span class="mb-1.5 block text-sm font-medium text-slate-700">체크리스트</span>
                <div id="check-list" class="space-y-2"></div>
                <div class="mt-2 flex gap-2">
                  <input id="check-input" type="text" maxlength="120" placeholder="항목을 적고 추가" class="min-w-0 flex-1 rounded-xl border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-slate-400 focus:ring-4 focus:ring-slate-100" />
                  <button id="check-add" type="button" class="rounded-lg bg-white px-3 py-2 text-sm font-medium text-slate-700 ring-1 ring-inset ring-slate-200 hover:bg-slate-50">추가</button>
                </div>
              </div>

              <label class="block">
                <span class="mb-1.5 block text-sm font-medium text-slate-700">반복</span>
                <select id="repeat-input" class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm outline-none focus:border-slate-400 focus:ring-4 focus:ring-slate-100">
                  <option value="none">없음</option>
                  <option value="daily">매일</option>
                  <option value="weekly">매주</option>
                  <option value="monthly">매월</option>
                </select>
              </label>

              <div class="grid gap-4 sm:grid-cols-2">
                <label class="block">
                  <span class="mb-1.5 block text-sm font-medium text-slate-700">마감일 <span class="text-rose-500">*</span></span>
                  <input id="due-input" type="date" class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-slate-400 focus:ring-4 focus:ring-slate-100" />
                  <p class="mt-1.5 text-xs leading-5 text-slate-400">마감일에 따라 지난 일정, 오늘, 앞으로 3일, 이후 일정으로 나뉩니다.</p>
                </label>
                <div>
                  <span class="mb-1.5 block text-sm font-medium text-slate-700">우선순위</span>
                  <div id="priority-picker" class="grid grid-cols-3 gap-2">
                    <button type="button" data-priority="High" class="rounded-xl border border-slate-200 px-2 py-2 text-sm font-medium text-slate-600">높음</button>
                    <button type="button" data-priority="Medium" class="rounded-xl border border-slate-200 px-2 py-2 text-sm font-medium text-slate-600">보통</button>
                    <button type="button" data-priority="Low" class="rounded-xl border border-slate-200 px-2 py-2 text-sm font-medium text-slate-600">낮음</button>
                  </div>
                </div>
              </div>

              <p id="form-error" class="hidden text-sm text-rose-600"></p>
            </div>

            <div class="flex items-center justify-between gap-3 border-t border-slate-100 px-5 py-4">
              <button id="delete-task" type="button" class="hidden text-sm font-medium text-rose-600 hover:text-rose-700">삭제</button>
              <div class="ml-auto flex items-center gap-2">
                <button id="cancel-button" type="button" class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100">취소</button>
                <button id="submit-button" type="submit" class="rounded-lg bg-slate-900 px-4 py-2 text-sm font-medium text-white hover:bg-slate-800 disabled:opacity-50">추가</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div id="detail" class="fixed inset-0 z-40 hidden" aria-hidden="true">
      <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm"></div>
      <div class="relative z-10 flex min-h-full items-end justify-center p-4 sm:items-center">
        <div data-detail-panel role="dialog" aria-modal="true" aria-labelledby="detail-title" class="w-full max-w-lg rounded-2xl border border-slate-200 bg-white shadow-xl">
          <div class="flex items-start justify-between gap-4 border-b border-slate-100 px-5 py-4">
            <div class="min-w-0">
              <div id="detail-badges" class="flex flex-wrap items-center gap-1.5"></div>
              <h2 id="detail-title" class="mt-2 break-words text-base font-semibold leading-6"></h2>
              <p id="detail-meta" class="mt-1 text-sm text-slate-500"></p>
            </div>
            <button id="detail-close" type="button" class="rounded-lg p-2 text-slate-400 hover:bg-slate-100 hover:text-slate-700" aria-label="닫기">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-4 w-4" aria-hidden="true">
                <path stroke-linecap="round" d="M6 6l12 12M18 6 6 18" />
              </svg>
            </button>
          </div>
          <div class="detail-scroll overflow-y-auto px-5 py-4">
            <div id="detail-checks" class="mb-4 space-y-1"></div>
            <p id="detail-body" class="whitespace-pre-wrap break-words text-sm leading-6 text-slate-700"></p>
          </div>
          <div class="flex flex-wrap items-center gap-2 border-t border-slate-100 px-5 py-4">
            <button id="detail-delete" type="button" class="text-sm font-medium text-rose-600 hover:text-rose-700">삭제</button>
            <div class="ml-auto flex flex-wrap items-center gap-2">
              <button id="detail-edit" type="button" class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100">수정</button>
              <button id="detail-start" type="button" class="hidden rounded-lg bg-white px-3 py-2 text-sm font-medium text-slate-700 ring-1 ring-inset ring-slate-200 hover:bg-slate-50">시작</button>
              <button id="detail-primary" type="button" class="rounded-lg bg-slate-900 px-4 py-2 text-sm font-medium text-white hover:bg-slate-800">완료</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="confirm" class="fixed inset-0 z-50 hidden" aria-hidden="true">
      <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm"></div>
      <div class="relative z-10 flex min-h-full items-center justify-center p-4">
        <div data-confirm-panel role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" class="w-full max-w-sm rounded-2xl border border-slate-200 bg-white p-5 shadow-xl">
          <h2 id="confirm-title" class="text-base font-semibold"></h2>
          <p id="confirm-body" class="mt-2 text-sm leading-6 text-slate-500"></p>
          <div class="mt-5 flex justify-end gap-2">
            <button id="confirm-cancel" type="button" class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100">취소</button>
            <button id="confirm-accept" type="button" class="rounded-lg bg-rose-600 px-3.5 py-2 text-sm font-medium text-white hover:bg-rose-700 disabled:opacity-50">삭제</button>
          </div>
        </div>
      </div>
    </div>

    <div id="toast" role="status" class="z-toast pointer-events-none fixed bottom-6 left-1/2 -translate-x-1/2 translate-y-2 rounded-xl bg-slate-900 px-4 py-2.5 text-sm text-white opacity-0 shadow-lg transition duration-200"></div>

    <script src="/script.js" defer></script>
  </body>
</html>
